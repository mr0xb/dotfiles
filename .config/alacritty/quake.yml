shell:
  program: /bin/zsh

import:
    - ~/.config/alacritty/themes/dracula.yml
  #    - ~/.config/alacritty/bindings.yml

cursor:
  style: Block

selection:
  save_to_clipboard: true
hints:
  enabled:
    - regex: "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\" {-}\\^⟨⟩`]+"
      command: open
      post_processing: true
      mouse:
        mods: Control|Shift

window:
  dimensions:
    columns: 500
    lines: 30
  opacity: 0.9
  position:
    x: 0
    y: 0
  padding:
    x: 5
    y: 5
  decorations: none

scrolling:
  history: 100000
  multiplier: 3

font:
  size: 18
  normal:
    family: "MesloLGS NF"
    style: Regular
  bold:
    family: "MesloLGS NF"
    style: Bold
  italic:
    family: "MesloLGS NF"
    style: Bold

key_bindings:
- { key: Return,          mods: Command,                    action: ToggleSimpleFullscreen }
